<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance | Synear</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/attendance.css">
</head>
<body>
<nav class="navbar navbar-expand-lg fixed-top">
    <div class="container">
        <a class="navbar-brand" href="index.html">
            <img src="../asset/logo.png" alt="logo" class="logo-full">
        </a>
        <a href="my-registration.html" class="btn btn-outline-primary">
            Back
        </a>
    </div>
</nav>
<section class="attendance-section">
    <div class="attendance-card">
        <span class="login-badge">
            EVENT ATTENDANCE
        </span>
        <h2>Attendance Check-In</h2>
        <p>
            Complete your attendance by scanning the QR Code or entering the attendance code provided by the organizer.
        </p>
        <div class="seminar-box">
            <h5 id="seminarTitle">
                UI/UX Design Seminar
            </h5>
            <span id="seminarDate">
                12 July 2026
            </span>
        </div>
        <div class="attendance-note">
            <i class="bi bi-info-circle-fill"></i>
            <span>
                QR Code or Attendance Code will be provided by the event organizer during the seminar.
            </span>
        </div>
        <div class="attendance-tab">
            <button type="button" class="tab-btn active" id="scanTab">
                <i class="bi bi-qr-code-scan"></i>
                Scan QR
            </button>
            <button type="button" class="tab-btn" id="codeTab">
                <i class="bi bi-key"></i>
                Enter Code
            </button>
        </div>
        <div class="attendance-content">
            <div id="scanContent">
                <div id="reader"></div>
            </div>
            <div id="codeContent" class="attendance-code">
                <label class="form-label">
                    Attendance Code
                </label>
                <input
                    type="text"
                    class="form-control"
                    id="attendanceCode"
                    placeholder="Enter attendance code">
            </div>
        </div>
        <div class="status-box">
            <span>Status</span>
            <strong id="attendanceStatus">
                Not Checked In
            </strong>
        </div>
        <button class="btn btn-login-main w-100" id="completeAttendance">
            Complete Attendance
        </button>
    </div>
</section>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="../js/attendance.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
