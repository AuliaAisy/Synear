<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Registration | Synear</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/my-registration.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="../asset/logo.png" alt="logo" class="logo-full">
            </a>
            <div class="ms-auto">
                <a href="index.html" class="btn btn-outline-primary">
                    Back Home
                </a>
            </div>
        </div>
    </nav>

    <section class="registration-list-section">
        <div class="container">

            <div class="section-title">
                <span class="login-badge">
                    MY REGISTRATION
                </span>
                <h2>Registered Seminars</h2>
                <p>
                    Here are all seminars you have successfully registered for.
                </p>
            </div>

            <div class="registration-card">

                <div class="registration-image">
                    <img src="../asset/uiux.jpg" alt="Seminar">
                </div>

                <div class="registration-content">

                    <span class="badge bg-success">
                        Registered
                    </span>

                    <h4 id="seminarTitle">
                        UI/UX Design Seminar
                    </h4>

                    <div class="registration-info">

                        <div>
                            <i class="bi bi-calendar-event"></i>
                            <span id="seminarDate">
                                12 July 2026
                            </span>
                        </div>

                        <div>
                            <i class="bi bi-geo-alt"></i>
                            <span>
                                Jakarta Convention Center
                            </span>
                        </div>

                    </div>

                    <div class="registration-price">

                        <span>Registration Fee</span>

                        <strong id="seminarPrice">
                            FREE
                        </strong>

                    </div>

                    <div class="registration-action">

                        <a href="attendance.html" class="btn btn-login-main">
                            Attendance
                        </a>

                        <a href="detail.html" class="btn btn-outline-primary">
                            View Detail
                        </a>

                    </div>

                </div>

            </div>

        </div>
    </section>

    <script src="../js/my-registration.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
