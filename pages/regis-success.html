<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Successful | Synear</title>
    <link rel="icon" type="image/png" href="../asset/logo3.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/regis-success.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="../asset/logo.png" alt="logo" class="logo-full">
            </a>
        </div>
    </nav>

    <section class="success-section">
        <div class="success-card">

            <div class="success-icon">
                <i class="bi bi-check-circle-fill"></i>
            </div>

            <span class="success-badge">
                REGISTRATION SUCCESSFUL
            </span>

            <h2>You're Successfully Registered!</h2>

            <p>
                Your seminar registration has been confirmed. We look forward to seeing you at the event.
            </p>

            <div class="success-info">

                <div class="info-item">
                    <span>Seminar</span>
                    <strong id="seminarTitle">
                        UI/UX Design Seminar
                    </strong>
                </div>

                <div class="info-item">
                    <span>Date</span>
                    <strong id="seminarDate">
                        12 July 2026
                    </strong>
                </div>

                <div class="info-item">
                    <span>Status</span>
                    <strong class="status-success">
                        Confirmed
                    </strong>
                </div>

            </div>

            <div class="d-grid gap-3 mt-4">

                <a id="viewRegistration" href="#" class="btn btn-login-main">
                    View My Registration
                </a>

                <a href="index.html" class="btn btn-outline-primary">
                    Back to Home
                </a>

            </div>

        </div>
    </section>

    <script src="../js/regis-success.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
