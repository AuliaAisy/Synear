<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Synear</title>
    <link rel="icon" type="image/png" href="../asset/logo3.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/register.css">
    <link rel="stylesheet" href="../css/notif.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="../asset/logo.png" alt="logo" class="logo-full">
            </a>
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto me-5">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="explore.html">Explore</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <button
                        class="btn btn-icon position-relative"
                        onclick="window.location.href='notif.html'">
                        <i class="bi bi-bell"></i>
                        <span class="notification-dot"></span>
                    </button>
                    <a href="login.html" class="btn btn-login">
                        Login
                    </a>
                    <a href="register.html" class="btn btn-register active-login">
                        Register
                    </a>
                </div>
            </div>
        </div>
    </nav>
    <section class="register-section">
        <div class="register-card">
            <span class="login-badge">
                CREATE ACCOUNT
            </span>
            <h2>Create Your Account</h2>
            <p>
                Join Synear and discover inspiring seminars to improve your knowledge and career.
            </p>
            <form id="registerForm">
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="fullname" placeholder="Enter your full name">
                </div>
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email" placeholder="Enter your email">
                </div>
                <div class="mb-3">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" id="phone" placeholder="Enter your phone number">
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <div class="password-box">
                        <input type="password" class="form-control" id="password" placeholder="Enter your password">
                        <button type="button" class="toggle-password" id="togglePassword">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Confirm Password</label>
                    <div class="password-box">
                        <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm your password">
                        <button type="button" class="toggle-password" id="toggleConfirmPassword">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="agree">
                    <label class="form-check-label" for="agree">
                        I agree to the Terms & Conditions
                    </label>
                </div>
                                <button type="submit" class="btn btn-login-main w-100">
                    Create Account
                </button>
                <div class="divider">
                    <span>or continue with</span>
                </div>
                <button type="button" class="btn btn-google w-100">
                    <img src="../asset/google.png" alt="Google">
                    Continue with Google
                </button>
                <div class="register-link">
                    Already have an account?
                    <a href="login.html">Login</a>
                </div>
            </form>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/register.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
