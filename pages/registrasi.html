<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seminar Registration | Synear</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/registrasi.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="../asset/logo.png" alt="logo" class="logo-full">
            </a>
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto me-5">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="explore.html">Explore</a>
                    </li>
                </ul>
                <div class="d-flex align-items-center gap-3">
                    <button class="btn btn-icon">
                        <i class="bi bi-search"></i>
                    </button>
                    <button class="btn btn-icon position-relative">
                        <i class="bi bi-bell"></i>
                        <span class="notification-dot"></span>
                    </button>
                    <div id="authArea">
                        <a href="login.html" class="btn btn-login">Login</a>
                        <a href="register.html" class="btn btn-register">Register</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <section class="registration-section">
        <div class="registration-card">

            <span class="login-badge">
                SEMINAR REGISTRATION
            </span>
            <h2>Complete Your Registration</h2>
            <p>
                Fill in your personal information to secure your seat in this seminar.
            </p>
            <div class="seminar-summary">
                <div class="summary-header">
                    <img src="../asset/uiux.jpg" alt="Seminar">
                    <div>
                        <h5 id="seminarTitle">
                            UI/UX Design Seminar
                        </h5>
                        <span id="seminarDate">
                            12 July 2026
                        </span>
                    </div>
                </div>
                <div class="summary-price">
                    <span>Registration Fee</span>
                    <h4 id="seminarPrice">
                        FREE
                    </h4>
                </div>
            </div>
            <form id="registrationForm">
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="fullname">
                </div>
                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control" id="email">
                </div>
                <div class="mb-3">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" id="phone">
                </div>
                <div class="mb-3">
                    <label class="form-label">Institution</label>
                    <input type="text" class="form-control" id="institution" placeholder="University / Company">
                </div>

                <div class="mb-3">
                    <label class="form-label">Occupation</label>
                    <select class="form-select" id="occupation">
                        <option value="">Select Occupation</option>
                        <option>Student</option>
                        <option>University Student</option>
                        <option>Teacher</option>
                        <option>Employee</option>
                        <option>Entrepreneur</option>
                        <option>Freelancer</option>
                    </select>
                </div>

                <div id="paymentSection">
                                        <div class="mb-3">
                        <label class="form-label">Payment Method</label>
                        <select class="form-select" id="paymentMethod">
                            <option value="">Select Payment Method</option>
                            <option>QRIS</option>
                            <option>GoPay</option>
                            <option>DANA</option>
                            <option>OVO</option>
                            <option>Bank Transfer</option>
                        </select>
                    </div>
                </div>

                <div class="form-check mb-4">
                    <input class="form-check-input" type="checkbox" id="agree">
                    <label class="form-check-label" for="agree">
                        I confirm that the information above is correct.
                    </label>
                </div>

                <button type="submit" class="btn btn-login-main w-100">
                    Complete Registration
                </button>

            </form>

        </div>

    </section>

    <script src="../js/auth.js"></script>
    <script src="../js/registrasi.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
