<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificates | Synear</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/sertifikat.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="../asset/logo.png" class="logo-full" alt="Synear">
            </a>
            <a href="index.html" class="btn btn-outline-primary">
                Back
            </a>
        </div>
    </nav>
    <section class="sertifikat-section">
        <div class="container">
            <div class="section-title text-center mb-5">
                <span class="login-badge">MY CERTIFICATES</span>
                <h2>Certificate History</h2>
                <p>All certificates you have earned after completing seminar attendance.</p>
            </div>
            <div id="certificateList">
                <!-- Certificate Card -->
                <div class="certificate-item">
                    <div class="certificate-left">
                        <div class="certificate-icon">
                            <i class="bi bi-award-fill"></i>
                        </div>
                        <div>
                            <h5>UI/UX Design Seminar</h5>
                            <span>12 July 2026</span>
                        </div>
                    </div>
                    <a href="sertifikat-detail.html" class="btn btn-login-main">
                        View Certificate
                    </a>
                </div>
            </div>
        </div>
    </section>
    <script src="../js/sertifikat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
